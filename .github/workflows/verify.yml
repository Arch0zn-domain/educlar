name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Types, data, build and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: local
      BETTER_AUTH_URL: http://127.0.0.1:3000
      DATA_DIR: .data/ci-build
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test domain, services and included official snapshot
        run: npm test
      - name: Test official data normalization
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - name: Build application
        run: npm run build
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test isolated browser flows
        run: npm run test:e2e
      - name: Retain failed browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
